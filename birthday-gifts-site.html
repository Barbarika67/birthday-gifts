<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Birthday Gifts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg1:#ff7a00;--bg2:#ff9c3a;--bg3:#c24a00;--glass:rgba(90,30,0,.3);--glass2:rgba(60,20,0,.35);--text:#fff;--soft:#ffe3cc;--accent:#fff;--accent-text:#2b1200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#c25a00;--bg2:#d97a22;--bg3:#6a2600}}
:root[data-theme="dark"]{--bg1:#c25a00;--bg2:#d97a22;--bg3:#6a2600}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3)) fixed;display:grid;place-items:center;padding:16px}
.frame{width:min(1100px,100%);min-height:560px;border-radius:30px;padding:24px 30px;background:linear-gradient(150deg,rgba(255,150,40,.5),rgba(160,60,0,.55));box-shadow:0 30px 70px #0005,inset 0 1px 0 #fff3;position:relative;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:12px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.logo b{background:#fff;color:#2b1200;border-radius:4px;padding:2px 5px;font-size:11px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--glass2);border-radius:26px;padding:6px;max-width:100%}
nav button{border:0;background:none;color:var(--text);font:inherit;font-size:11px;font-weight:500;letter-spacing:.05em;padding:8px 14px;border-radius:18px;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-text)}
.dots{font-size:12px;color:var(--soft)}
.hero{flex:1;display:grid;grid-template-columns:1fr 1.15fr .6fr;gap:20px;align-items:center;margin:10px 0}
.hero>*{animation:in .6s ease-out both}
.hero .mid{animation-delay:.1s}.hero .right{animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.arrows{display:flex;gap:8px;margin-bottom:18px}
.arrows button{width:30px;height:30px;border-radius:50%;border:0;background:var(--glass2);color:#fff;cursor:pointer;font-size:16px}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;margin:0 0 14px;font-weight:700}
.left p{font-size:13px;line-height:1.6;color:var(--soft);max-width:330px;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#2b1200;text-decoration:none;font-weight:700;font-size:12px;padding:10px 18px;border-radius:22px}
.btn.off{opacity:.55}
.mid{display:grid;place-items:center;text-align:center;min-height:280px}
.prod{font-size:clamp(120px,20vw,220px);line-height:1;filter:drop-shadow(0 28px 22px #0006);animation:fl 4s ease-in-out infinite}
.mid img{max-width:100%;max-height:320px;border-radius:20px;filter:drop-shadow(0 24px 20px #0006)}
@keyframes fl{50%{transform:translateY(-10px) rotate(-2deg)}}
.right{text-align:right}
.price{font-size:clamp(34px,4.6vw,48px);font-weight:700}
.sub{font-size:12px;color:var(--soft);margin:18px 0 10px}
.score{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;color:#2b1200;font-weight:700;font-size:17px}
.score.none{background:var(--glass2);color:#fff}
.tag{display:inline-block;margin-top:14px;background:var(--glass2);padding:5px 12px;border-radius:14px;font-size:11px}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:12px}
.from{color:var(--soft)}
.tagline{text-align:center;font-size:15px;line-height:1.35;flex:1}
.thumb{width:58px;height:58px;border-radius:14px;background:var(--glass2);border:0;font-size:30px;cursor:pointer}
@media (max-width:780px){.hero{grid-template-columns:1fr;text-align:center}.left p{margin:0 auto 18px}.arrows{justify-content:center}.right{text-align:center}.mid{min-height:200px}.prod{font-size:130px}}
@media (prefers-reduced-motion:reduce){.hero>*,.prod{animation:none}}
.welcome{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(150deg,#ff9a2e,#b84300);transition:opacity .6s,transform .6s}
.welcome.gone{opacity:0;transform:scale(1.05);pointer-events:none}
.welcome>*{animation:in .7s ease-out both}
.welcome .gift{font-size:clamp(90px,16vw,150px);line-height:1;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 24px 20px #0006)}
.welcome h1{font-size:clamp(36px,7vw,72px);margin:10px 0 12px}
.welcome p{color:var(--soft);max-width:420px;font-size:15px;line-height:1.6;margin:0 0 26px}
.welcome .btn{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:14px 28px}
</style>
</head>
<body>
<div class="frame">
 <div class="welcome" id="welcome"><div class="logo"><b>BG</b>BIRTHDAY GIFTS</div><div class="gift">🎁</div><h1>Welcome to my<br>birthday gifts</h1><p>I made this little page with everything I’m hoping to get this year. Take a look!</p><button class="btn" id="open">Open the gifts ›</button></div>
 <header><div class="logo"><b>BG</b>BIRTHDAY GIFTS</div><nav id="nav"></nav><div class="dots" id="dots"></div></header>
 <section class="hero" id="hero"></section>
 <div class="bottom"><div class="from" id="from"></div><div class="tagline" id="tag"></div><button class="thumb" id="thumb" aria-label="Next gift"></button></div>
</div>
<script>
// Edit this list: price = dollars or null, want = score out of 10 or null
const GIFTS=[
 {name:["Green","Earbuds"],tab:"EARBUDS",from:"SKYLRK",emoji:"🎧",price:null,want:null,photo:"",link:"",note:"The green ones, not released yet. I’m waiting for the drop.",tag:"Not released yet"},
 {name:["Green","Phone Case"],tab:"PHONE CASE",from:"SKYLRK",emoji:"📱",price:null,want:null,photo:"",link:"",note:"A green case from SKYLRK to match.",tag:"Coming soon"}
];
let i=0;const $=id=>document.getElementById(id);
function render(){
 const g=GIFTS[i],nx=GIFTS[(i+1)%GIFTS.length];
 $("nav").innerHTML=GIFTS.map((x,k)=>`<button class="${k===i?"on":""}" data-k="${k}">${x.tab}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{i=+b.dataset.k;render()});
 $("dots").textContent=`${i+1} / ${GIFTS.length}`;
 $("hero").innerHTML=`
  <div class="left"><div class="arrows"><button id="p" aria-label="Previous">‹</button><button id="n" aria-label="Next">›</button></div>
   <h1>${g.name[0]}<br>${g.name[1]}</h1><p>${g.note}</p>
   <a class="btn ${g.link?"":"off"}" ${g.link?`href="${g.link}" target="_blank" rel="noopener"`:""}>${g.link?"View gift ›":"Link coming soon"}</a></div>
  <div class="mid">${g.photo?`<img src="${g.photo}" alt="${g.name.join(" ")}">`:`<div class="prod">${g.emoji}</div>`}</div>
  <div class="right"><div class="price">${g.price==null?"TBA":"$"+g.price}</div>
   <div class="sub">How much I want it</div>
   <div class="score ${g.want==null?"none":""}">${g.want==null?"?/10":g.want+"/10"}</div>
   <div>${g.tag?`<span class="tag">${g.tag}</span>`:""}</div></div>`;
 $("p").onclick=()=>go(-1);$("n").onclick=()=>go(1);
 $("from").textContent="From: "+g.from;
 $("tag").textContent=g.tag||"Birthday gift";
 $("thumb").textContent=nx.emoji;
}
const go=d=>{i=(i+d+GIFTS.length)%GIFTS.length;render()};
$("thumb").onclick=()=>go(1);
$("open").onclick=()=>$("welcome").classList.add("gone");
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let sx=null;addEventListener("touchstart",e=>sx=e.touches[0].clientX);
addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1);sx=null});
render();
</script>
</body>
</html>
